[project]
name = "agelens-mlops"
version = "0.1.0"
description = "Academic facial age estimation and MLOps experiments"
requires-python = ">=3.12,<3.13"

[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100
